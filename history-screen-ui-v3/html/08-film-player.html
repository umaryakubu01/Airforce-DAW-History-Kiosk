<!doctype html><html lang="en"><meta charset="utf-8"><title>08-film-player.html</title><style>
:root{--bg:#060B14;--s1:#0C1624;--s2:#122034;--ln:rgba(255,255,255,.09);--tx:#E9EDF3;--mu:#8C9DB1;--br:#D6B566;--br2:#A8863A;--bl:#5B8FCB}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;color:var(--tx);font:400 30px/1.45 Inter,sans-serif;background:radial-gradient(1100px 700px at 88% -8%,#15305a 0,transparent 62%),radial-gradient(900px 600px at -5% 112%,#2a200c 0,transparent 60%),var(--bg)}
body{position:relative}
body:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 120px);pointer-events:none}
.serif,h1,h2{font-family:"Bitstream Charter",Charter,Georgia,serif;font-weight:700;letter-spacing:-.015em}
.top{position:relative;height:104px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--ln)}
.brand{display:flex;gap:20px;align-items:center;width:470px}.brand img{height:66px}.brand b{display:block;font:600 26px Inter;line-height:1.2}.brand span{font:500 18px Inter;letter-spacing:.16em;color:var(--br);text-transform:uppercase}
.steps{display:flex;gap:8px}.st{display:flex;align-items:center;gap:12px;height:104px;padding:0 18px;font:500 21px Inter;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-1px}
.st i{font-style:normal;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:17px}
.st.on{color:var(--tx);border-color:var(--br)}.st.on i{background:var(--br);color:#1a1405;border-color:var(--br)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:76px;padding:0 34px;font:600 26px Inter;border-radius:10px;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.04);color:var(--tx)}
.btn.gold{background:linear-gradient(180deg,#E3C57A,#B8923F);border-color:#E3C57A;color:#1a1405}
.home{width:200px;justify-content:center;border-color:rgba(214,181,102,.6);color:var(--br)}
.eb{font:600 20px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--br)}
.gl{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--ln);border-radius:14px}
.ph{position:relative;border:1.5px dashed rgba(255,255,255,.22);border-radius:14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 12px,transparent 12px 24px),linear-gradient(160deg,#10203a,#0a1424);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#93A5BA;text-align:center}
.ph b{font:600 20px Inter;letter-spacing:.16em;text-transform:uppercase}.ph i{font:400 21px Inter;font-style:normal;opacity:.85}
.tag{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:30px;border:1px solid rgba(214,181,102,.5);color:var(--br);font:600 19px Inter;letter-spacing:.1em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:10px;height:64px;padding:0 26px;border-radius:40px;border:1.5px solid rgba(255,255,255,.2);font:500 23px Inter;color:var(--tx);background:rgba(255,255,255,.04)}
.chip.on{background:var(--br);border-color:var(--br);color:#1a1405;font-weight:600}
.foot{position:absolute;left:0;right:0;bottom:0;height:128px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:linear-gradient(0deg,rgba(6,11,20,.96),rgba(6,11,20,.6));border-top:1px solid var(--ln)}
.ghost{font-family:"Bitstream Charter",Georgia,serif;font-weight:700;line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(214,181,102,.28)}
</style><body><div style="position:absolute;inset:0;background:url(../assets/posters/war.jpg) center/cover"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,20,.82) 0,rgba(6,11,20,0) 26%,rgba(6,11,20,0) 52%,rgba(6,11,20,.96) 100%)"></div>
<div style="position:absolute;left:56px;right:56px;top:40px;display:flex;justify-content:space-between;align-items:flex-start"><div style="display:flex;gap:28px;align-items:center"><button class="btn" style="background:rgba(6,11,20,.6)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Films</button><div><div class="eb">Retrospective · 1967 – 1970</div><h2 style="font-size:50px;line-height:1.1;margin-top:4px">Wings over the war</h2></div></div><button class="btn home" style="background:rgba(6,11,20,.6)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</button></div>

<div style="display:flex;align-items:center;justify-content:space-between;margin-top:30px"><button class="btn" style="width:330px;background:rgba(6,11,20,.6)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M19 5L9 12l10 7z"/></svg>Previous film</button>
<div style="display:flex;align-items:center;gap:30px"><button class="btn" style="width:130px;flex-direction:column;gap:2px;height:88px;background:rgba(6,11,20,.6)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8H7M7 4L4 7l3 3"/></svg><span style="font-size:19px">10 s</span></button><button style="width:124px;height:124px;border-radius:50%;border:0;background:linear-gradient(180deg,#E3C57A,#B8923F);color:#1a1405;display:grid;place-items:center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14" stroke-width="3.2"/></svg></button><button class="btn" style="width:130px;flex-direction:column;gap:2px;height:88px;background:rgba(6,11,20,.6)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-8-8h5M17 4l3 3-3 3"/></svg><span style="font-size:19px">10 s</span></button></div>
<div style="display:flex;gap:16px"><button class="btn" style="width:90px;padding:0;background:rgba(6,11,20,.6)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button><button class="btn" style="width:290px;background:rgba(6,11,20,.6)">Next film<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M5 5l10 7L5 19z"/></svg></button></div></div></div></body></html>
